<style>
/* Layout: forest sidebar, cream canvas, sticky page header, three-column editor. Single committed light look. */
:root{
  --bg:#0A0A0C; --surface:#1E2025; --zinc:#1E2025; --ink:#F4F4F5; --green:#00E676; --mint:#10B981; --amber:#F59E0B; --coral:#F59E0B; --red:#EF4444;
  --ink2:rgba(244,244,245,.72); --ink3:rgba(244,244,245,.6); --ink4:rgba(244,244,245,.42);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16); --tint:rgba(255,255,255,.03); --tint2:rgba(255,255,255,.06);
  --green-bg:rgba(0,230,118,.12); --red-bg:rgba(239,68,68,.12);
  --font:'Montserrat',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/1.5 var(--font);-webkit-font-smoothing:antialiased;padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{display:flex;min-height:100vh}

/* sidebar */
.sb{width:248px;flex:none;background:var(--zinc);color:var(--ink);display:flex;flex-direction:column;padding:24px 16px;position:sticky;top:0;height:100vh;z-index:40;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.mark{width:28px;height:28px;flex:none;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.logo b{display:block;font-size:12px;letter-spacing:.06em;line-height:1.15}
.logo span{display:block;font-size:10px;opacity:.65;letter-spacing:.04em}
.sbl{padding:0 8px 8px;font-size:10px;font-weight:700;letter-spacing:.14em;opacity:.5;text-transform:uppercase}
.ws{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px 12px;margin-bottom:20px;border:1px solid rgba(255,255,255,.22);border-radius:8px;font-size:13px;font-weight:600}
.ws:hover{border-color:rgba(255,255,255,.5)}
.ws small{font-size:9px;opacity:.6;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nsec{padding:16px 12px 6px;font-size:10px;font-weight:700;letter-spacing:.14em;opacity:.45;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:400;color:#fff}
.ni:hover{background:rgba(255,255,255,.12)}
.ni.on{background:rgba(255,255,255,.16);font-weight:600}
.ni svg{flex:none;width:16px;height:16px;opacity:.6}
.ni.on svg{opacity:1}
.ni span{flex:1}
.ni em{font-style:normal;font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;background:rgba(255,255,255,.16)}
.cred{margin-top:auto;padding:16px 12px 0;border-top:1px solid rgba(255,255,255,.14)}
.cred b{display:block;font-size:11px;font-weight:600}
.cred .cr{height:6px;border-radius:4px;background:rgba(255,255,255,.18);margin:10px 0 6px;overflow:hidden}
.cred .cr i{display:block;height:100%;width:62%;background:var(--coral)}
.cred span{font-size:11px;opacity:.7}

/* main */
.mc{flex:1;min-width:0;display:flex;flex-direction:column}
.mbar{display:none;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.mbar button{font-size:20px;line-height:1;padding:2px 6px}
.mbar b{font-size:13px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:32px max(40px,env(safe-area-inset-right,0px)) 24px max(40px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hd>div:first-child{min-width:0}
.eb{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--green);margin-bottom:8px;text-transform:uppercase}
.hd h1{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.4px;text-wrap:balance}
.hd p{margin-top:8px;font-size:13px;line-height:1.5;max-width:64ch;color:var(--ink2)}
.hb{display:flex;gap:10px;flex:none;flex-wrap:wrap}
.bd{flex:1;padding:32px max(40px,env(safe-area-inset-right,0px)) 72px max(40px,env(safe-area-inset-left,0px))}

/* primitives */
.btn{white-space:nowrap;padding:11px 18px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid transparent;transition:background .12s,transform .12s}
.btn-p{background:var(--green);color:#0A0A0C}
.btn-p:hover{background:#00C864}
.btn-o{border-color:var(--line2);color:var(--ink)}
.btn-o:hover{background:var(--tint2)}
.btn-s{padding:8px 13px;font-size:11px;border-radius:7px}
.lnk{font-size:11px;font-weight:600;color:var(--green)}
.lnk:hover{text-decoration:underline}
.card{padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.card.pad32{padding:32px}
.dark{background:var(--zinc);color:var(--ink);border-color:var(--line2)}
.cap{font-size:10px;font-weight:700;letter-spacing:.13em;color:var(--green);text-transform:uppercase}
.dark .cap{color:#fff;opacity:.75}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--green);margin-bottom:8px;text-transform:uppercase}
.inp,.sel,.txa{width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:8px;font-size:13px;font-weight:500;background:var(--bg)}
.inp{font-size:14px;font-weight:400;padding:13px 14px}
.txa{font-size:14px;font-weight:400;line-height:1.55;resize:vertical;padding:14px}
.hint{margin-top:8px;font-size:11px;color:var(--ink3)}
.stack{display:flex;flex-direction:column}
.g24{gap:24px}.g16{gap:16px}.g12{gap:12px}
.row{display:flex;align-items:center;gap:12px}
.wrap{flex-wrap:wrap}
.sp{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
h2.t16{font-size:16px;font-weight:600}
h2.t18{font-size:18px;font-weight:600}
h2.t22{font-size:22px;font-weight:700;letter-spacing:-.3px}
.seg{display:flex;gap:6px;padding:5px;border:1px solid var(--line);border-radius:10px;width:fit-content;max-width:100%;background:var(--surface);overflow-x:auto}
.seg button{white-space:nowrap;flex:none;padding:8px 16px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--green);color:#0A0A0C}
.seg.sm{padding:3px;border-radius:8px;border-color:var(--line)}
.seg.sm button{padding:6px 12px;font-size:11px}
.chip{padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--line2);color:var(--ink)}
.chip.on{background:var(--green);color:#0A0A0C;border-color:var(--green)}
.tgb{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--line);text-align:left}
.tgb.on{background:var(--tint2);border-color:rgba(244,244,245,.4)}
.bx{width:14px;height:14px;flex:none;border-radius:4px;border:1px solid rgba(244,244,245,.3)}
.on>.bx,.bx.on{background:var(--ink)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;border:1px solid rgba(244,244,245,.18);white-space:nowrap}
.pill.ok{background:var(--green-bg)}.pill.warn{background:var(--red-bg)}.pill.mut{background:var(--tint2)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:5px;background:rgba(0,230,118,.12);color:var(--green);text-transform:uppercase}
.tag.red{background:var(--red-bg);color:var(--ink)}
.tag.mut{background:var(--tint2);color:var(--ink)}
.bar{height:6px;border-radius:4px;background:rgba(244,244,245,.1);overflow:hidden}
.bar i{display:block;height:100%}
.sg{display:grid;gap:24px}
.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.split{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.split2{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.side{grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.side.s360{grid-template-columns:minmax(0,1fr) 360px}
.side.s300{grid-template-columns:minmax(0,1fr) 300px}
.stat{padding:24px}
.stat .v{display:flex;align-items:baseline;gap:8px;margin-top:16px;font-size:34px;font-weight:700;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:0}
.stat .d{margin-top:16px;font-size:11px;color:var(--ink3)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tw>.in{min-width:680px}
.th,.tr{display:grid;gap:16px;align-items:center;padding:15px 24px}
.th{background:var(--tint);padding-block:14px;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--green);text-transform:uppercase}
.tr{border-top:1px solid rgba(244,244,245,.08);font-variant-numeric:tabular-nums}
.tr:hover{background:rgba(244,244,245,.03)}
.tr .n{font-size:13px;font-weight:600;line-height:1.4}
.muted{color:var(--ink2)}
.small{font-size:11px;color:var(--ink3)}
.mm{font-variant-numeric:tabular-nums}

/* engines */
.eng{display:grid;grid-template-columns:130px 1fr 48px;align-items:center;gap:16px;font-size:12px;font-weight:600}
.eng .bar{height:10px;border-radius:6px;background:rgba(244,244,245,.09)}
.gap{display:flex;align-items:flex-start;gap:12px;padding-bottom:12px;border-bottom:1px solid rgba(244,244,245,.09)}
.gap:last-child{border-bottom:0;padding-bottom:0}

/* wizard */
.wiz{display:grid;grid-template-columns:236px minmax(0,1fr);gap:40px;align-items:start}
.wizin{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.stp{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:12px;border-radius:9px;width:100%}
.stp.on{background:var(--tint2)}
.stp i{font-style:normal;width:22px;height:22px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1px solid rgba(244,244,245,.2)}
.stp.on i{background:var(--green);color:#0A0A0C}
.stp b{display:block;font-size:12px;font-weight:600;line-height:1.35}
.stp span{display:block;margin-top:4px;font-size:11px;color:var(--ink3)}
.big{font-size:44px;font-weight:700;line-height:1;letter-spacing:-1.5px;color:var(--mint);font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:11px}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{font-weight:600;text-align:right}
.ent{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid rgba(244,244,245,.14);border-radius:8px}
.drop{padding:22px;border:1px dashed var(--line2);border-radius:8px;text-align:center;font-size:12px;color:var(--ink2);background:var(--tint)}
.dial{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:10px}
.dial span:last-child{font-weight:400;color:var(--ink3)}
input[type=range]{width:100%;accent-color:var(--ink);height:18px;margin:0}
.rv{display:grid;grid-template-columns:150px 1fr;gap:16px;padding-bottom:16px;border-bottom:1px solid rgba(244,244,245,.09)}
.rv b{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--green)}
.rv span{font-size:13px;line-height:1.5}
.nav2{display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding-top:24px;border-top:1px solid rgba(244,244,245,.1)}

/* chat */
.chat{border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;min-height:520px}
.msgs{flex:1;padding:28px;display:flex;flex-direction:column;gap:20px}
.m{display:flex}
.m.u{justify-content:flex-end}
.m div{max-width:78%;padding:14px 16px;border-radius:12px;font-size:13px;line-height:1.55;background:var(--bg);border:1px solid rgba(244,244,245,.14)}
.m.u div{background:var(--green);color:#0A0A0C;border-color:var(--green)}
.cin{padding:16px 20px;border-top:1px solid rgba(244,244,245,.1)}
.pipe{margin:16px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:12px;font-size:12px;line-height:1.5}

/* keyword workspace */
.kwg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kwc{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:200px}
.kwh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kwh b{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.kwh i{font-style:normal;font-size:11px;font-weight:600;color:var(--ink3);border:1px solid var(--line2);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.kwd{margin:4px 0 12px;font-size:10.5px;color:var(--ink3);overflow-wrap:anywhere}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{padding:6px 10px;border-radius:6px;font-size:11px;font-weight:500;line-height:1.35;text-align:left;background:rgba(0,230,118,.07);border:1px solid rgba(0,230,118,.22);color:var(--ink)}
.kw:hover{background:rgba(0,230,118,.14)}
.kw.on{background:var(--green);color:#0A0A0C;border-color:var(--green)}
.selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

/* queue */
.bulk{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px;margin-bottom:24px;border:1px solid rgba(244,244,245,.16);border-radius:10px;background:var(--surface)}
.cb{width:16px;height:16px;border-radius:4px;border:1px solid rgba(244,244,245,.3);display:block}
.cb.on{background:var(--ink)}

/* editor */
.ed{display:grid;grid-template-columns:212px minmax(0,1fr) 340px;gap:28px;align-items:start}
.ed aside{position:sticky;top:190px}
.ol{display:flex;flex-direction:column;gap:2px}
.ol button{text-align:left;padding:8px 10px;border-radius:7px;font-size:12px;line-height:1.4;color:var(--ink2)}
.ol button.h{font-weight:600;color:var(--ink)}
.ol button.on{background:var(--tint2);color:var(--ink)}
.ol button.sub{padding-left:22px}
.ol button.thin{color:var(--red)}
.cov{margin-top:24px;padding:14px;border:1px solid rgba(244,244,245,.14);border-radius:9px}
.cov b{display:block;font-size:11px;font-weight:600;margin-bottom:8px}
.cov span{font-size:11px;line-height:1.5;color:var(--ink2)}
.doc{padding:44px 48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.doc h2{margin:14px 0 0;font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.6px;text-wrap:balance;scroll-margin-top:200px}
.doc h3{margin:0 0 12px;font-size:17px;font-weight:600;scroll-margin-top:200px}
.doc p{font-size:15px;line-height:1.65;max-width:72ch}
.doc .blk{margin-top:28px}
.doc .lead{margin-top:20px;scroll-margin-top:200px}
.doc .hl{background:rgba(0,230,118,.06);border-left:3px solid var(--green);padding:14px 16px}
.ins{background:rgba(0,230,118,.12);border-radius:3px;padding:1px 3px}
.foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:36px;padding-top:24px;border-top:1px solid rgba(244,244,245,.1)}
.foot .small{margin-left:auto}
.live{padding:20px;border-radius:12px;background:var(--zinc);color:var(--ink);border:1px solid var(--line)}
.live .cap{color:#fff;opacity:.75}
.live .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.live .num{display:flex;align-items:baseline;gap:6px;margin-top:12px}
.live .num b{font-size:40px;font-weight:700;line-height:1;letter-spacing:-1.4px;color:var(--coral);font-variant-numeric:tabular-nums}
.live .num b.pass{color:var(--mint)}
.live .num span{font-size:12px;font-weight:600;opacity:.7}
.sug{padding:18px;border:1px solid rgba(244,244,245,.16);border-radius:11px;background:var(--surface)}
.sug.done{border-color:var(--green);background:rgba(0,230,118,.06)}
.sug.off{border-color:rgba(244,244,245,.1);background:rgba(244,244,245,.03);opacity:.75}
.sug .h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sug .h span:last-child{font-size:11px;font-weight:600;color:var(--ink3)}
.sug b{display:block;font-size:12px;font-weight:600;line-height:1.45}
.sug p{margin-top:8px;font-size:12px;line-height:1.5;color:var(--ink2)}
.sug .a{display:flex;gap:8px;margin-top:14px}

/* score */
.ring{position:relative;width:208px;height:208px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:52px;font-weight:700;line-height:1;letter-spacing:-2px;color:var(--amber);font-variant-numeric:tabular-nums}
.ring .c b.pass{color:var(--green)}
.ring .c span{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--green);margin-top:8px}
.dim .bar{height:12px;border-radius:7px;background:rgba(244,244,245,.09)}
.heat{display:grid;grid-template-columns:120px repeat(4,minmax(0,1fr));gap:6px}
.heat div{padding:14px 10px;border-radius:6px;font-size:12px;font-weight:700;text-align:center;line-height:1.3}
.heat .hh{background:none;color:var(--green);font-size:9px;padding:10px 4px;letter-spacing:.06em}
.heat .rl{text-align:left;font-weight:600}
.rec{padding:20px;border:1px solid rgba(244,244,245,.13);border-radius:11px;background:var(--surface)}
.snip{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);font-size:12px;line-height:1.5}

/* prompt library / cards */
.cl4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px;margin-bottom:28px}
.cl4 .card{padding:20px;border-radius:11px}
.cl4 b.n{display:block;margin-top:12px;font-size:24px;letter-spacing:-.6px}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tpl .card{padding:20px;border-radius:11px;text-align:left}
.tpl .card:hover{border-color:var(--line2)}
.int{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.int .card{padding:22px;border-radius:11px}
.ini{width:36px;height:36px;flex:none;border-radius:9px;border:1px solid rgba(244,244,245,.18);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--bg)}
.rule{display:flex;align-items:flex-start;gap:11px;text-align:left;font-size:12px;line-height:1.5;width:100%}
.rule .cb{margin-top:1px;flex:none}

/* charts */
.lc{position:relative;height:240px;margin-left:36px}
.lc svg{position:absolute;inset:0;width:100%;height:100%}
.yl{position:absolute;left:-36px;width:28px;text-align:right;font-size:10px;color:var(--ink3);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.xl{display:flex;justify-content:space-between;margin:10px 0 0 36px;font-size:10px;color:var(--ink3)}
.bc{position:relative;height:150px;display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 36px,rgba(244,244,245,.07) 36px,rgba(244,244,245,.07) 37px)}
.bc>div{flex:1;position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.bc i{display:block;width:70%;max-width:30px;background:#3F4248;border-radius:3px 3px 0 0;min-height:2px}
.bc i.pk{background:var(--green)}
.bc span{position:absolute;bottom:-20px;font-size:9px;color:var(--ink3);white-space:nowrap}
.leg{display:flex;gap:24px;margin-top:18px;font-size:11px;color:var(--ink2);flex-wrap:wrap}
.leg span{display:flex;align-items:center;gap:8px}
.leg i{display:block;width:14px;height:2px;background:var(--ink)}
.cit{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid rgba(244,244,245,.07)}
.cit:last-child{border-bottom:0}
.cit>div:first-child{flex:1;min-width:0}
.ban{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:20px;border:1px solid rgba(244,244,245,.2);font-size:12px;font-weight:600}
.ban button{font-size:13px;color:var(--ink4);line-height:1}
.ban.ok{border-color:rgba(0,230,118,.3);background:var(--green-bg)}

/* team / usage */
.mrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(244,244,245,.08)}
.mrow:last-child{border-bottom:0}
.av{position:relative;width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--tint2)}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid #fff}
.mrow .i{flex:1;min-width:0}
.mrow .i b{display:block;font-size:13px;font-weight:600}
.mrow select{padding:6px 10px;border:1px solid var(--line2);border-radius:6px;font-size:12px;background:var(--surface)}
.trash{opacity:.7}

.demo{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--zinc);color:var(--green);border:1px solid var(--line2);font-size:9px;font-weight:700;letter-spacing:.18em;padding:5px 12px;border-radius:16px;z-index:60;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--green);color:#0A0A0C;padding:12px 18px;border-radius:9px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:70;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ov{display:none;position:fixed;inset:0;background:rgba(244,244,245,.35);z-index:35}

@media(max-width:1100px){

let tt;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2400)}
function go(s,keep){S.screen=s;closeMenu();render();if(!keep)window.scrollTo(0,0);history.replaceState(null,'',s==='dashboard'?location.pathname:'#'+s)}
function closeMenu(){$('#sb').classList.remove('open');$('#ov').classList.remove('open')}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,v=t.dataset.v;
 switch(a){
  case 'menu':$('#sb').classList.toggle('open');$('#ov').classList.toggle('open');break;
  case 'go':go(v);break;
  case 'client':S.client=(S.client+1)%CLIENTS.length;render();toast('Switched workspace to '+CL());break;
  case 'flow':S.flow=v;render();break;
  case 'step':S.step=+v;render();break;
  case 'next':S.step=Math.min(4,S.step+1);render();break;
  case 'prev':S.step=Math.max(1,S.step-1);render();break;
  case 'adj':S.adj=tgl(S.adj,+v);render();break;
  case 'tog':S.tog=tgl(S.tog,+v);render();break;
  case 'viz':S.viz=v;render();break;
  case 'range':S.range=v;render();break;
  case 'ptab':S.ptab=v;render();break;
  case 'qsel':S.sel=tgl(S.sel,+v);render();break;
  case 'bulk':toast(v+' applied to '+S.sel.length+' prompts (demo)');break;
  case 'run':{
    S.queue.unshift({id:++S.nid,p:S.flow==='wizard'||S.flow==='chat'?S.promptText:'new article from brief',c:'Mechanics',st:'Queued',pct:0});
    S.sel=[S.nid];S.screen='queue';render();window.scrollTo(0,0);toast('Added to batch 041. Estimated 4 minutes.');break;}
  case 'draftgap':{const g=['how do answer engines choose which sources to cite','geo vs seo what is the difference','how to measure ai search visibility','best geo tools for b2b saas'];S.promptText=g[+v];S.flow='wizard';S.step=1;go('generate');break;}
  case 'draftprompt':S.promptText=PROMPTS[+v][0];S.flow='wizard';S.step=1;go('generate');break;
  case 'tpl':S.flow='single';S.brief='Use the "'+v+'" template. '+S.brief;go('generate');toast('Template loaded: '+v);break;
  case 'apply':{const i=+v;if(!S.acc.includes(i))S.acc.push(i);S.dis=S.dis.filter(x=>x!==i);S.ol=i===2?5:S.ol;render();toast('Applied: +'+SUG[i].imp+' predicted. Score is '+liveScore()+'.');break;}
  case 'dismiss':{const i=+v;S.dis=tgl(S.dis,i);S.acc=S.acc.filter(x=>x!==i);render();break;}
  case 'recapply':{const i=+v;if(i<3&&!S.acc.includes(i))S.acc.push(i);go('editor');if(i<3)toast('Applied in editor: +'+SUG[i].imp+' predicted');break;}
  case 'ol':{S.ol=+v;if(+v===5&&!S.acc.includes(2)){render();toast('FAQ is thin. Apply the structure suggestion to fix it.');break;}render();const el=document.getElementById(DOCIDS[+v]);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});break;}
  case 'wp':liveScore()<75?toast('Blocked: GEO score '+liveScore()+' is below the publish gate of 75.'):toast('Sent to WordPress (demo). Schema injected.');break;
  case 'rule':S.rules[+v]=!S.rules[+v];render();break;
  case 'guard':S.guard[+v]=!S.guard[+v];render();break;
  case 'unban':S.ban.splice(+v,1);render();break;
  case 'banadd':{const i=$('#banin');const w=i.value.trim();if(w&&!S.ban.includes(w)){S.ban.push(w);render();}break;}
  case 'kw':{const k=t.dataset.k;S.kw=tgl(S.kw,k);render();break;}
  case 'kwadd':{const i=$('#kwin');const w=i.value.trim();if(w&&!S.custom.includes(w)){S.custom.push(w);S.kw.push(w);render();}break;}
  case 'kwuse':if(!S.kw.length)break;S.promptText=S.kw[0];S.adj=[];S.flow='wizard';S.step=1;go('generate');toast(S.kw.length+' keywords sent to the wizard');break;
  case 'chipfill':S.chatInput=v;render();break;
  case 'send':{const t=S.chatInput.trim();if(!t)break;const R=['Noted. I will keep the definition to one sentence and add the comparison table after it.',CL()+' is not cited for that prompt in Gemini yet. I can open every section with an answer block.','Updated the brief. Predicted GEO score is now 84.'];S.msgs.push(['u',t],['a',R[(S.msgs.length/2|0)%3]]);S.chatInput='';render();break;}
  case 'toast':toast(v);break;
 }
});
